name: TRONIFY CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tip191-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install crypto deps
        run: pip install pycryptodome base58 ecdsa

      - name: TIP-191 unit tests
        run: python test_tip191_verify.py

      - name: Compile wsgi_bind.py
        run: python -m py_compile wsgi_bind.py

  deploy-pythonanywhere:
    needs: tip191-and-syntax
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files + reload WebApp
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USER }}
          PA_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
        run: |
          set -e
          HOST="${PA_HOST:-${PA_USER}.pythonanywhere.com}"
          for f in wsgi_bind.py index.html test_tip191_verify.py; do
            if [ -f "$f" ]; then
              echo "Uploading $f ..."
              curl -sS -X POST \
                -H "Authorization: Token ${PA_TOKEN}" \
                -F "content=@${f}" \
                "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/files/path/home/${PA_USER}/${f}"
              echo
            fi
          done
          echo "Reloading webapp ${HOST} ..."
          curl -sS -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${HOST}/reload/"
          echo
          echo "Smoke: nonce API"
          curl -sS "https://${HOST}/api/auth/nonce?tg_id=1&address=TATunwEDpE8mCD9Dih5BWyUfShkgVgoH25" | head -c 200
          echo
