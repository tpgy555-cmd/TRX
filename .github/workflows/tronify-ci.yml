name: TRONIFY CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply wallet CSS fix
        run: python tools/fix_wallet_css.py
      - name: Install crypto deps
        run: pip install pycryptodome base58 ecdsa
      - name: TIP-191 unit tests
        run: python test_tip191_verify.py
      - name: Wallet page contract tests
        run: python test_wallet_page.py
      - name: Compile backend
        run: python -m py_compile wsgi_bind.py main.py bot_topup_handlers.py resource_watcher.py

  deploy-pythonanywhere:
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply wallet CSS fix before upload
        run: python tools/fix_wallet_css.py
      - name: Upload files + reload WebApp
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USER }}
          PA_HOST: ${{ secrets.PYTHONANYWHERE_HOST }}
        run: |
          set -e
          if [ -z "$PA_TOKEN" ] || [ -z "$PA_USER" ]; then
            echo "Secrets not set; skip deploy. Tests already ran."
            exit 0
          fi
          HOST="${PA_HOST:-${PA_USER}.pythonanywhere.com}"
          for f in wsgi_bind.py index.html main.py bot_topup_handlers.py resource_watcher.py; do
            if [ -f "$f" ]; then
              echo "Uploading $f ..."
              code=$(curl -sS -o /tmp/pa_out -w "%{http_code}" -X POST \
                -H "Authorization: Token ${PA_TOKEN}" \
                -F "content=@${f}" \
                "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/files/path/home/${PA_USER}/${f}")
              echo "status $code"
              cat /tmp/pa_out || true
              echo
              if [ "$code" != "200" ] && [ "$code" != "201" ]; then exit 1; fi
            fi
          done
          echo "Reloading webapp ${HOST} ..."
          curl -sS -X POST -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${HOST}/reload/"
